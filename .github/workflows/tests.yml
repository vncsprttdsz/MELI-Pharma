name: Testes

on:
  push:
    paths: ["latam_tracker/**", "tests/**", "requirements.txt", "pyproject.toml"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
