name: Preços LATAM GRU-LAX

# Consulta 4x por dia (horários de Brasília: ~05h, 11h, 15h, 20h). O preço em dinheiro vem do
# Google Flights, que aceita consultas a partir do GitHub (o site da LATAM responde 403 daqui).
on:
  schedule:
    - cron: "7 8,14,18,23 * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Só diagnosticar uma busca (não salva dados)"
        type: boolean
        default: false
      test_notify:
        description: "Só enviar uma mensagem de teste no WhatsApp/ntfy"
        type: boolean
        default: false
      diagnose_args:
        description: "Argumentos do diagnóstico (ex.: --back --date 2027-04-11)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: latam
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LATAM_DEBUG_DIR: debug
      LATAM_DELAY: "4"
      LATAM_HEADLESS: "0"
      LATAM_MODES: ${{ vars.LATAM_MODES || 'cash' }}
      LATAM_CASH_SOURCE: ${{ vars.LATAM_CASH_SOURCE || 'google' }}
      LATAM_FETCHER: ${{ vars.LATAM_FETCHER || 'browser' }}
      LATAM_ENGINE: ${{ vars.LATAM_ENGINE || 'chromium' }}
      LATAM_PROXY: ${{ secrets.LATAM_PROXY }}
      LATAM_NTFY_TOPIC: ${{ secrets.LATAM_NTFY_TOPIC }}
      LATAM_WHATSAPP_PHONE: ${{ secrets.LATAM_WHATSAPP_PHONE }}
      LATAM_WHATSAPP_APIKEY: ${{ secrets.LATAM_WHATSAPP_APIKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador (só se for consultar o site da LATAM)
        if: ${{ contains(vars.LATAM_MODES, 'points') || vars.LATAM_CASH_SOURCE == 'latam' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnosticar
        if: ${{ inputs.diagnose }}
        run: xvfb-run -a python -m latam_tracker diagnose ${{ inputs.diagnose_args }}

      - name: Testar aviso
        if: ${{ inputs.test_notify }}
        run: python -m latam_tracker test-notify

      - name: Consultar
        if: ${{ !inputs.diagnose && !inputs.test_notify }}
        run: |
          code=0
          xvfb-run -a python -m latam_tracker run || code=$?
          # 3 = algumas buscas falharam, mas o resto foi salvo
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then exit "$code"; fi

      - name: Salvar arquivos de depuração
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: latam-debug
          path: debug/
          retention-days: 5
          if-no-files-found: ignore

      - name: Commitar dados
        if: ${{ !inputs.diagnose && !inputs.test_notify }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/latam docs/latam.html
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "latam: consulta de $(TZ=America/Sao_Paulo date '+%F %H:%M')"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep $((i * 10)); done
          fi
