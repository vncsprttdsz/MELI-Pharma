name: Coleta diária MELI Farma

on:
  schedule:
    # 09:07 UTC = 06:07 em Brasília
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      browser:
        description: "Usar Chromium (Playwright) em vez de requests"
        type: boolean
        default: false
      diagnose:
        description: "Só diagnosticar (mostra no log o que o scraper vê; não salva dados)"
        type: boolean
        default: false
      diagnose_args:
        description: "Argumentos extras do diagnóstico (ex.: --deep --url URL)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MELI_DEBUG_DIR: debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador
        if: ${{ inputs.browser || vars.MELI_FETCHER == 'browser' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnosticar
        if: ${{ inputs.diagnose }}
        env:
          MELI_FETCHER: ${{ inputs.browser && 'browser' || vars.MELI_FETCHER || 'requests' }}
        run: python -m meli_farma diagnose ${{ inputs.browser && '--browser' || '' }} ${{ inputs.diagnose_args }}

      - name: Coletar
        if: ${{ !inputs.diagnose }}
        env:
          MELI_FETCHER: ${{ inputs.browser && 'browser' || vars.MELI_FETCHER || 'requests' }}
        run: python -m meli_farma scrape

      - name: Salvar HTML para depuração
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          retention-days: 7

      - name: Commitar dados
        if: ${{ !inputs.diagnose }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "dados: coleta de $(TZ=America/Sao_Paulo date +%F)"
            git push
          fi

