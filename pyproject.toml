[project]
name = "meli-farma"
version = "0.1.0"
description = "Monitoramento dos produtos da loja oficial Mercado Livre Farma"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
meli-farma = "meli_farma.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meli_farma", "latam_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
meli_farma = ["*.html"]
latam_tracker = ["*.html"]
