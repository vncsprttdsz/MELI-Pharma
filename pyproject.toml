[project]
name = "latam-tracker"
version = "0.1.0"
description = "Monitor de preços de voos diretos LATAM (Google Flights)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "flights>=0.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
latam-tracker = "latam_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["latam_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
latam_tracker = ["*.html"]
