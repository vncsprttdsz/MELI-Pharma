<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor MELI Farma</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --border: rgba(11,11,11,0.10);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --up: #006300; --down: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #898781;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --up: #0ca30c; --down: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #898781;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --up: #0ca30c; --down: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #898781;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 22px; margin: 0 0 4px; }
header p { margin: 0; color: var(--ink-2); }
h2 { font-size: 16px; margin: 0 0 12px; }
section { margin-top: 28px; }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 20px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 600; margin-top: 2px; }
.tile .sub { font-size: 13px; color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.row h2 { margin: 0; margin-right: auto; }
select, input[type=search] {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 6px; padding: 5px 8px; max-width: 100%;
}
input[type=search] { min-width: 220px; flex: 1; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button {
  font: inherit; color: var(--ink-2); background: transparent; border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
.tabs button[aria-selected=true] { color: var(--ink); border-color: var(--accent); font-weight: 600; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tooltip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 160px; display: none; z-index: 2;
}
.tooltip .d { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .r { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tooltip .r span:first-child { display: flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--ink-2); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; white-space: nowrap; cursor: default; }
th.sort { cursor: pointer; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.cat { color: var(--ink-2); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Monitor MELI Farma</h1>
    <p id="subtitle"></p>
  </header>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2>Produtos listados na loja</h2>
    <div class="chart" id="chart-total"></div>
  </section>

  <section class="card">
    <div class="row">
      <h2>Produtos por categoria</h2>
      <select id="hist-depth" aria-label="Nível de categoria"></select>
    </div>
    <div class="chart" id="chart-cats"></div>
  </section>

  <section class="card">
    <div class="row">
      <h2>Categorias na última coleta</h2>
      <select id="cat-depth" aria-label="Nível de categoria"></select>
    </div>
    <div class="table-wrap"><table id="cat-table"></table></div>
  </section>

  <section class="card" id="changes-card">
    <div class="row">
      <h2 id="changes-title">Mudanças</h2>
      <div class="tabs" role="tablist" id="changes-tabs"></div>
    </div>
    <div class="table-wrap"><table id="changes-table"></table></div>
    <p class="note" id="changes-note"></p>
  </section>

  <section class="card">
    <div class="row">
      <h2>Produtos</h2>
      <input type="search" id="q" placeholder="Buscar por nome ou ID…" aria-label="Buscar produto">
      <select id="prod-cat" aria-label="Filtrar por categoria"></select>
    </div>
    <div class="table-wrap"><table id="prod-table"></table></div>
    <p class="note" id="prod-note"></p>
    <div class="tabs"><button id="more" hidden>Mostrar mais</button></div>
  </section>
</main>

<script>
const DATA = {"generated_at":"2026-09-25T12:22+00:00","last":null,"prev":null,"runs":[],"history":{"1":{"dates":[],"series":[]}},"categories":[],"changes":null,"products":[],"sep":" > "};
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const nf = new Intl.NumberFormat("pt-BR");
const brl = v => v == null ? "—" : v.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; };
const shortDate = d => { const [, m, dd] = d.split("-"); return `${dd}/${m}`; };
const delta = (cur, prev) => {
  if (prev == null) return `<span class="muted">—</span>`;
  const d = cur - prev;
  if (d === 0) return `<span class="muted">0</span>`;
  return `<span class="${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${nf.format(Math.abs(d))}</span>`;
};
const depthLabel = d => d === 1 ? "Nível 1 (principal)" : `Nível ${d}`;

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

// Gráfico de linhas em SVG com crosshair + tooltip.
function lineChart(el, dates, series) {
  el.innerHTML = "";
  if (!dates.length) { el.innerHTML = `<p class="empty">Sem dados ainda.</p>`; return; }
  const W = Math.max(320, el.clientWidth || 800), H = 280;
  const m = {t: 12, r: 16, b: 28, l: 52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxV = niceMax(Math.max(1, ...series.flatMap(s => s.values.filter(v => v != null))));
  const x = i => m.l + (dates.length === 1 ? iw / 2 : i * iw / (dates.length - 1));
  const y = v => m.t + ih - v / maxV * ih;
  const color = i => `var(${SERIES[i % SERIES.length]})`;
  const ns = "http://www.w3.org/2000/svg";
  let svg = `<svg xmlns="${ns}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linhas">`;
  for (let k = 0; k <= 4; k++) {
    const v = maxV * k / 4, yy = y(v);
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="var(${k ? "--grid" : "--axis"})" stroke-width="1"/>`;
    svg += `<text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${nf.format(Math.round(v))}</text>`;
  }
  const step = Math.max(1, Math.ceil(dates.length / Math.floor(iw / 64)));
  dates.forEach((d, i) => {
    if ((i % step === 0 && dates.length - 1 - i >= step) || i === dates.length - 1)
      svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${shortDate(d)}</text>`;
  });
  const markers = dates.length <= 20;
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]);
    let dPath = "", pen = false;
    pts.forEach(p => { if (!p) { pen = false; return; } dPath += `${pen ? "L" : "M"}${p[0]},${p[1]}`; pen = true; });
    svg += `<path d="${dPath}" fill="none" stroke="${color(si)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (markers) pts.forEach(p => { if (p) svg += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${color(si)}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  svg += `<line id="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>`;
  svg += `<rect x="${m.l - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent" id="hit"/></svg>`;
  el.insertAdjacentHTML("beforeend", svg);
  const tip = document.createElement("div"); tip.className = "tooltip"; el.appendChild(tip);
  if (series.length > 1) {
    el.insertAdjacentHTML("beforeend", `<div class="legend">${series.map((s, i) =>
      `<span><i class="sw" style="background:${color(i)}"></i>${esc(s.name)}</span>`).join("")}</div>`);
  }
  const svgEl = el.querySelector("svg"), xh = svgEl.querySelector("#xh");
  const show = evt => {
    const r = svgEl.getBoundingClientRect(), sx = (evt.clientX - r.left) * W / r.width;
    const i = dates.length === 1 ? 0 : Math.max(0, Math.min(dates.length - 1, Math.round((sx - m.l) / iw * (dates.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    const rows = series.map((s, si) => ({s, si, v: s.values[i]})).filter(o => o.v != null).sort((a, b) => b.v - a.v);
    tip.innerHTML = `<div class="d">${fmtDate(dates[i])}</div>` + rows.map(o =>
      `<div class="r"><span><i class="sw" style="background:${color(o.si)}"></i>${esc(o.s.name)}</span><b>${nf.format(o.v)}</b></div>`).join("");
    tip.style.display = "block";
    const px = x(i) * r.width / W, er = el.getBoundingClientRect();
    const left = px + 14 + tip.offsetWidth > er.width ? px - 14 - tip.offsetWidth : px + 14;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = "8px";
  };
  const hide = () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); };
  svgEl.addEventListener("pointermove", show);
  svgEl.addEventListener("pointerleave", hide);
}

function renderHeader() {
  const sub = document.getElementById("subtitle");
  if (!DATA.last) { sub.textContent = "Nenhuma coleta registrada ainda."; return; }
  sub.innerHTML = `Loja oficial <a href="https://www.mercadolivre.com.br/farmacia/mercadolivrefarma">Mercado Livre Farma</a> · última coleta em ${fmtDate(DATA.last)} · ${DATA.runs.length} coleta(s) no histórico`;
  const last = DATA.runs.at(-1), prev = DATA.runs.at(-2);
  const l1 = DATA.categories.filter(c => c.depth === 1);
  const prevL1 = l1.filter(c => c.prev != null).length;
  const prices = DATA.products.map(p => p.p).filter(v => v != null).sort((a, b) => a - b);
  const median = prices.length ? (prices.length % 2 ? prices[(prices.length - 1) / 2] : (prices[prices.length / 2 - 1] + prices[prices.length / 2]) / 2) : null;
  const tiles = [
    ["Produtos coletados", nf.format(last.products), prev ? `${delta(last.products, prev.products)} desde ${fmtDate(prev.date)}` : "primeira coleta"],
    ["Total informado pelo ML", last.ml != null ? nf.format(last.ml) : "—", "contador da listagem da loja"],
    ["Categorias principais", nf.format(l1.length), prev ? `${prevL1} já existiam na coleta anterior` : ""],
    ["Preço mediano", brl(median), `${nf.format(prices.length)} produtos com preço`],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="card tile"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join("");
}

function renderTotal() {
  const dates = DATA.runs.map(r => r.date);
  const series = [{name: "Coletados", values: DATA.runs.map(r => r.products)}];
  if (DATA.runs.some(r => r.ml != null)) series.push({name: "Informado pelo ML", values: DATA.runs.map(r => r.ml)});
  lineChart(document.getElementById("chart-total"), dates, series);
}

function depthSelect(el, onChange) {
  const depths = Object.keys(DATA.history).map(Number);
  el.innerHTML = depths.map(d => `<option value="${d}">${depthLabel(d)}</option>`).join("");
  el.hidden = depths.length < 2;
  el.addEventListener("change", onChange);
}

function renderCatHistory() {
  const sel = document.getElementById("hist-depth");
  const h = DATA.history[sel.value] || {dates: [], series: []};
  lineChart(document.getElementById("chart-cats"), h.dates, h.series);
}

let catSort = {key: "products", dir: -1};
function renderCatTable() {
  const depth = Number(document.getElementById("cat-depth").value || 1);
  const rows = DATA.categories.filter(c => c.depth === depth || (depth === 1 && c.depth === 0));
  const total = rows.reduce((a, c) => a + c.products, 0) || 1;
  rows.sort((a, b) => {
    const k = catSort.key, va = a[k] ?? -Infinity, vb = b[k] ?? -Infinity;
    return typeof va === "string" ? catSort.dir * va.localeCompare(vb) : catSort.dir * (va - vb);
  });
  const cols = [["name", "Categoria", ""], ["products", "Produtos", "n"], ["prev", "Δ vs anterior", "n"],
    ["share", "% do total", "n"], ["median", "Preço mediano", "n"], ["avg", "Preço médio", "n"],
    ["discounted", "Com desconto", "n"], ["ml", "Informado ML", "n"]];
  const t = document.getElementById("cat-table");
  if (!rows.length) { t.innerHTML = `<tr><td class="empty">Sem dados.</td></tr>`; return; }
  t.innerHTML = `<thead><tr>${cols.map(([k, l, c]) => `<th class="${c} ${k !== "share" && k !== "prev" ? "sort" : ""}" data-k="${k}">${l}${catSort.key === k ? (catSort.dir < 0 ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(c => `<tr><td>${esc(c.name)}</td><td class="n">${nf.format(c.products)}</td><td class="n">${DATA.prev ? delta(c.products, c.prev ?? 0) : "—"}</td>` +
      `<td class="n">${(c.products / total * 100).toFixed(1).replace(".", ",")}%</td><td class="n">${brl(c.median)}</td><td class="n">${brl(c.avg)}</td>` +
      `<td class="n">${nf.format(c.discounted)}</td><td class="n">${c.ml != null ? nf.format(c.ml) : "—"}</td></tr>`).join("") + "</tbody>";
  t.querySelectorAll("th.sort").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    catSort = {key: k, dir: catSort.key === k ? -catSort.dir : (k === "name" ? 1 : -1)};
    renderCatTable();
  }));
}

function productRow(p, extra = "") {
  return `<tr><td><a href="${esc(p.u)}" target="_blank" rel="noopener">${esc(p.t) || esc(p.id)}</a><div class="muted">${esc(p.id)}</div></td>` +
    `<td class="cat">${esc(p.c) || "—"}</td>${extra}</tr>`;
}

function renderChanges() {
  const card = document.getElementById("changes-card");
  const ch = DATA.changes;
  if (!ch) { card.hidden = true; return; }
  document.getElementById("changes-title").textContent = `Mudanças desde ${fmtDate(ch.previous)}`;
  const tabs = [["added", `Novos (${nf.format(ch.added_n)})`], ["removed", `Removidos (${nf.format(ch.removed_n)})`], ["price", `Preço alterado (${nf.format(ch.price_n)})`]];
  const tabsEl = document.getElementById("changes-tabs");
  let current = "added";
  const draw = () => {
    tabsEl.innerHTML = tabs.map(([k, l]) => `<button role="tab" data-k="${k}" aria-selected="${k === current}">${l}</button>`).join("");
    tabsEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { current = b.dataset.k; draw(); }));
    const list = ch[current], t = document.getElementById("changes-table");
    const totalN = ch[current === "price" ? "price_n" : current + "_n"];
    const shown = Math.min(100, list.length);
    document.getElementById("changes-note").textContent = shown < totalN ? `Mostrando ${shown} de ${nf.format(totalN)}.` : "";
    if (!list.length) { t.innerHTML = `<tr><td class="empty">Nenhum.</td></tr>`; return; }
    if (current === "price") {
      t.innerHTML = `<thead><tr><th>Produto</th><th>Categoria</th><th class="n">Antes</th><th class="n">Agora</th><th class="n">Variação</th></tr></thead><tbody>` +
        list.slice(0, 100).map(p => productRow(p, `<td class="n">${brl(p.op)}</td><td class="n">${brl(p.np)}</td><td class="n ${p.pct > 0 ? "down" : "up"}">${p.pct > 0 ? "+" : ""}${String(p.pct).replace(".", ",")}%</td>`)).join("") + "</tbody>";
    } else {
      t.innerHTML = `<thead><tr><th>Produto</th><th>Categoria</th><th class="n">Preço</th></tr></thead><tbody>` +
        list.slice(0, 100).map(p => productRow(p, `<td class="n">${brl(p.p)}</td>`)).join("") + "</tbody>";
    }
  };
  draw();
}

function renderProducts() {
  const sel = document.getElementById("prod-cat");
  const l1 = [...new Set(DATA.products.map(p => p.c.split(DATA.sep)[0] || ""))].sort();
  sel.innerHTML = `<option value="">Todas as categorias</option>` + l1.map(c => `<option value="${esc(c)}">${esc(c || "Sem categoria")}</option>`).join("");
  const q = document.getElementById("q");
  const PAGE = 100;
  let limit = PAGE;
  const more = document.getElementById("more");
  const draw = () => {
    const term = q.value.trim().toLowerCase(), cat = sel.value;
    const rows = DATA.products.filter(p =>
      (!sel.selectedIndex || (p.c.split(DATA.sep)[0] || "") === cat) &&
      (!term || p.t.toLowerCase().includes(term) || p.id.toLowerCase().includes(term)));
    const t = document.getElementById("prod-table");
    t.innerHTML = rows.length ? `<thead><tr><th>Produto</th><th>Categoria</th><th class="n">Preço</th><th class="n">De</th></tr></thead><tbody>` +
      rows.slice(0, limit).map(p => productRow(p, `<td class="n">${brl(p.p)}</td><td class="n muted">${p.o ? `<s>${brl(p.o)}</s>` : ""}</td>`)).join("") + "</tbody>"
      : `<tr><td class="empty">Nenhum produto encontrado.</td></tr>`;
    document.getElementById("prod-note").textContent = `${nf.format(rows.length)} produto(s)` + (rows.length > limit ? ` — mostrando ${limit}.` : ".");
    more.hidden = rows.length <= limit;
  };
  const reset = () => { limit = PAGE; draw(); };
  q.addEventListener("input", reset); sel.addEventListener("change", reset);
  more.addEventListener("click", () => { limit += PAGE; draw(); });
  draw();
}

renderHeader();
depthSelect(document.getElementById("hist-depth"), renderCatHistory);
depthSelect(document.getElementById("cat-depth"), renderCatTable);
renderTotal(); renderCatHistory(); renderCatTable(); renderChanges(); renderProducts();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderTotal(); renderCatHistory(); }, 150); });
</script>
</body>
</html>
